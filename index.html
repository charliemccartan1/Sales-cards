<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sales Cards</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    max-width: 720px;
    margin: 0 auto;
    padding: 16px;
    background: #faf9f6;
    color: #1a1a1a;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #666; margin: 0 0 4px; }
  .pending-banner {
    font-size: 13px; padding: 8px 12px; border-radius: 8px; margin-bottom: 16px;
    background: #fff4e0; color: #8a5a00; display: none;
  }
  .pending-banner.show { display: block; }
  .offline-banner {
    font-size: 13px; padding: 8px 12px; border-radius: 8px; margin-bottom: 16px;
    background: #fde8e8; color: #a30000; display: none;
  }
  .offline-banner.show { display: block; }
  label { font-size: 13px; color: #444; display: block; margin-bottom: 4px; }
  input[type="text"] {
    width: 100%; height: 44px; font-size: 16px; padding: 0 12px;
    border: 1px solid #ccc; border-radius: 8px; margin-bottom: 14px;
  }
  #lotsBox {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px;
    border: 1px solid #ddd; border-radius: 8px; padding: 10px; background: white;
    min-height: 48px;
  }
  .lot-chip {
    display: flex; align-items: center; gap: 6px;
    border: 1px solid #ccc; border-radius: 20px; padding: 8px 14px;
    font-size: 15px; cursor: pointer; user-select: none; background: #fff;
  }
  .lot-chip.checked { background: #1a1a1a; color: white; border-color: #1a1a1a; }
  .row { display: flex; gap: 8px; margin-bottom: 14px; }
  .row input { margin-bottom: 0; }
  button {
    height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid #1a1a1a;
    background: #1a1a1a; color: white; font-size: 15px; font-weight: 500;
  }
  button.secondary { background: white; color: #1a1a1a; }
  button:disabled { opacity: 0.5; }
  #saveBtn { width: 100%; margin-bottom: 8px; }
  #status { font-size: 13px; margin-bottom: 20px; min-height: 16px; }
  #status.error { color: #b00020; }
  #status.ok { color: #0a7d34; }
  h2 { font-size: 15px; font-weight: 600; margin: 24px 0 8px; }
  .lot-group { border: 1px solid #e2e2e2; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; background: white; }
  .lot-group h3 { font-size: 14px; margin: 0 0 6px; }
  .buyer-line { font-size: 13px; color: #333; display: flex; justify-content: space-between; padding: 3px 0; }
  .buyer-line.repeat { color: #a35b00; font-weight: 500; }
  .buyer-line.unsynced { color: #8a5a00; }
  .time { color: #888; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 10px; background: #fff4e0; color: #8a5a00; margin-left: 6px; }
</style>
</head>
<body>

<h1>Sales cards</h1>
<p class="sub" id="statusLine">Loading…</p>
<div class="offline-banner" id="offlineBanner">No connection — entries are being saved on this iPad and will sync automatically once you're back online.</div>
<div class="pending-banner" id="pendingBanner"></div>

<label for="buyerInput">Buyer name</label>
<input type="text" id="buyerInput" list="buyerList" placeholder="Start typing a name" autocomplete="off">
<datalist id="buyerList"></datalist>

<label>Lots viewed (tap all that apply)</label>
<div id="lotsBox"></div>

<div class="row">
  <input type="text" id="newLotInput" placeholder="Add a lot number for today">
  <button class="secondary" id="addLotBtn" type="button">Add lot</button>
</div>

<button id="saveBtn" type="button">Save</button>
<div id="status"></div>

<h2>Today, by lot</h2>
<div id="lotSummary"></div>

<script>
// ==== SET THIS to your deployed Apps Script web app URL ====
const SCRIPT_URL = "PASTE_YOUR_WEB_APP_URL_HERE";
// =============================================================

const buyerInput = document.getElementById("buyerInput");
const buyerList = document.getElementById("buyerList");
const lotsBox = document.getElementById("lotsBox");
const newLotInput = document.getElementById("newLotInput");
const addLotBtn = document.getElementById("addLotBtn");
const saveBtn = document.getElementById("saveBtn");
const statusEl = document.getElementById("status");
const statusLine = document.getElementById("statusLine");
const lotSummary = document.getElementById("lotSummary");
const offlineBanner = document.getElementById("offlineBanner");
const pendingBanner = document.getElementById("pendingBanner");

// Default lots for today — edit this list any time you add/change lots.
const DEFAULT_LOTS = [
  "Lot 100  BF  Kodi Bear x Ski Club",
  "Lot 151  BC  Ardad x Tiggy Two",
  "Lot 204  BC  Kodi Bear x Abashova",
  "Lot 283  BF  Galiway x Camomile Lawn",
  "Lot 680  BF  Nando Parrado x Faseeha",
];

let storedLots = JSON.parse(localStorage.getItem("todaysLots") || "null");
let todaysLots = storedLots && storedLots.length ? storedLots : DEFAULT_LOTS.slice();

// Cached data from the sheet (updated whenever we successfully sync)
let cachedBuyers = JSON.parse(localStorage.getItem("cachedBuyers") || "[]");
let cachedCards = JSON.parse(localStorage.getItem("cachedCards") || "[]");

// Queue of entries not yet successfully sent to the sheet
let queue = JSON.parse(localStorage.getItem("pendingQueue") || "[]");

let syncing = false;

function todayDateStr() {
  return new Date().toISOString().slice(0, 10);
}

function saveState() {
  localStorage.setItem("todaysLots", JSON.stringify(todaysLots));
  localStorage.setItem("cachedBuyers", JSON.stringify(cachedBuyers));
  localStorage.setItem("cachedCards", JSON.stringify(cachedCards));
  localStorage.setItem("pendingQueue", JSON.stringify(queue));
}

function renderLots() {
  lotsBox.innerHTML = "";
  todaysLots.forEach(lot => {
    const chip = document.createElement("div");
    chip.className = "lot-chip";
    chip.textContent = lot;
    chip.dataset.lot = lot;
    chip.onclick = () => chip.classList.toggle("checked");
    lotsBox.appendChild(chip);
  });
}

addLotBtn.onclick = () => {
  const val = newLotInput.value.trim();
  if (!val) return;
  if (!todaysLots.includes(val)) {
    todaysLots.push(val);
    saveState();
    renderLots();
  }
  newLotInput.value = "";
};

function setStatus(msg, cls) {
  statusEl.textContent = msg;
  statusEl.className = cls || "";
}

function updateBanners() {
  offlineBanner.classList.toggle("show", !navigator.onLine);
  if (queue.length > 0) {
    pendingBanner.classList.add("show");
    pendingBanner.textContent = `${queue.length} entr${queue.length === 1 ? "y" : "ies"} waiting to sync…`;
  } else {
    pendingBanner.classList.remove("show");
  }
}

// Merge cached (synced) cards with anything still sitting in the queue,
// so the on-screen summary and repeat-buyer detection are always accurate,
// even before a sync happens.
function allVisibleCards() {
  const queued = queue.map(q => ({
    date: q.date, buyer: q.buyer, lot: q.lot, timestamp: q.queuedAt, unsynced: true,
  }));
  return cachedCards.concat(queued);
}

function renderBuyerList() {
  const names = new Set(cachedBuyers);
  queue.forEach(q => names.add(q.buyer));
  buyerList.innerHTML = Array.from(names).map(b => `<option value="${b}">`).join("");
}

function renderSummary() {
  const today = todayDateStr();
  const cards = allVisibleCards().filter(c => c.date === today);
  const byLot = {};
  cards.forEach(c => {
    if (!byLot[c.lot]) byLot[c.lot] = [];
    byLot[c.lot].push(c);
  });

  const buyerCounts = {};
  cards.forEach(c => { buyerCounts[c.buyer] = (buyerCounts[c.buyer] || 0) + 1; });

  const lots = Object.keys(byLot).sort();
  if (lots.length === 0) {
    lotSummary.innerHTML = '<p style="font-size:13px;color:#888;">No cards recorded yet today.</p>';
    return;
  }

  lotSummary.innerHTML = lots.map(lot => {
    const entries = byLot[lot].map(c => {
      const isRepeat = buyerCounts[c.buyer] > 1;
      const time = new Date(c.timestamp).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      const cls = [isRepeat ? "repeat" : "", c.unsynced ? "unsynced" : ""].join(" ");
      return `<div class="buyer-line ${cls}">
        <span>${c.buyer}${isRepeat ? " (repeat)" : ""}${c.unsynced ? '<span class="tag">not synced</span>' : ""}</span>
        <span class="time">${time}</span>
      </div>`;
    }).join("");
    return `<div class="lot-group"><h3>Lot ${lot}</h3>${entries}</div>`;
  }).join("");
}

function renderAll() {
  renderBuyerList();
  renderSummary();
  updateBanners();
  statusLine.textContent = `${cachedBuyers.length} known buyers · ${cachedCards.length} synced cards`;
}

// Pull latest buyers/cards from the sheet, when online.
async function refreshFromSheet() {
  if (!navigator.onLine || SCRIPT_URL.includes("PASTE_YOUR")) return;
  try {
    const res = await fetch(SCRIPT_URL + "?action=data");
    const data = await res.json();
    cachedBuyers = data.buyers || [];
    cachedCards = data.cards || [];
    saveState();
  } catch (err) {
    // silently ignore — we'll just keep showing cached data
  }
  renderAll();
}

// Try to send every queued entry to the sheet. Stops at the first failure
// (keeps ordering, avoids hammering a dead connection).
async function syncQueue() {
  if (syncing || queue.length === 0 || !navigator.onLine) return;
  if (SCRIPT_URL.includes("PASTE_YOUR")) return;
  syncing = true;

  while (queue.length > 0) {
    const item = queue[0];
    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ buyer: item.buyer, date: item.date, lots: [item.lot] }),
      });
      queue.shift();
      saveState();
      updateBanners();
    } catch (err) {
      break; // stop trying, retry later
    }
  }

  syncing = false;
  await refreshFromSheet();
}

saveBtn.onclick = () => {
  const buyer = buyerInput.value.trim();
  const checkedLots = Array.from(lotsBox.querySelectorAll(".lot-chip.checked")).map(c => c.dataset.lot);

  if (!buyer) { setStatus("Enter a buyer name first.", "error"); return; }
  if (checkedLots.length === 0) { setStatus("Tick at least one lot.", "error"); return; }

  const date = todayDateStr();
  const now = new Date().toISOString();
  checkedLots.forEach(lot => {
    queue.push({ buyer, date, lot, queuedAt: now });
  });
  if (!cachedBuyers.some(b => b.toLowerCase() === buyer.toLowerCase())) {
    cachedBuyers.push(buyer);
  }
  saveState();

  setStatus(`Saved ${buyer} to ${checkedLots.length} lot(s) locally.`, "ok");
  buyerInput.value = "";
  lotsBox.querySelectorAll(".lot-chip.checked").forEach(c => c.classList.remove("checked"));
  buyerInput.focus();

  renderAll();
  syncQueue();
};

window.addEventListener("online", () => {
  updateBanners();
  syncQueue();
});
window.addEventListener("offline", updateBanners);

// Periodic retry in case the 'online' event doesn't fire reliably on iOS
setInterval(syncQueue, 15000);

renderLots();
renderAll();
refreshFromSheet().then(syncQueue);
</script>
</body>
</html>
