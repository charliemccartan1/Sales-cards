<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Fairyhouse 2026</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    max-width: 720px;
    margin: 0 auto;
    padding: 16px;
    background: #faf9f6;
    color: #1a1a1a;
  }
  #logo { display: block; max-height: 70px; margin: 0 auto 14px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; text-align: center; }
  .sub { font-size: 13px; color: #666; margin: 0 0 16px; text-align: center; }
  label { font-size: 13px; color: #444; display: block; margin-bottom: 4px; }
  input[type="text"] {
    width: 100%; height: 44px; font-size: 16px; padding: 0 12px;
    border: 1px solid #ccc; border-radius: 8px; margin-bottom: 14px;
  }
  #lotsBox {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px;
    border: 1px solid #ddd; border-radius: 8px; padding: 10px; background: white;
    min-height: 48px;
  }
  .lot-chip {
    display: flex; align-items: center; gap: 6px;
    border: 1px solid #ccc; border-radius: 20px; padding: 8px 14px;
    font-size: 15px; cursor: pointer; user-select: none; background: #fff;
  }
  .lot-chip.checked { background: #1a1a1a; color: white; border-color: #1a1a1a; }
  button {
    height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid #1a1a1a;
    background: #1a1a1a; color: white; font-size: 15px; font-weight: 500;
  }
  #saveBtn { width: 100%; margin-bottom: 8px; }
  #status { font-size: 13px; margin-bottom: 16px; min-height: 16px; }
  #status.error { color: #b00020; }
  #status.ok { color: #0a7d34; }
  h2 { font-size: 15px; font-weight: 600; margin: 20px 0 8px; }
  #pendingBanner {
    font-size: 13px; border-radius: 8px; padding: 8px 12px; margin-bottom: 14px;
    background: #f0f0ee; border: 1px solid #ddd; color: #555;
  }
  #pendingBanner.has-pending {
    background: #fff4e0; border-color: #e8c789; color: #7a5200;
  }
  .recent-row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 13px; background: white; border: 1px solid #e2e2e2; border-radius: 8px;
    padding: 8px 12px; margin-bottom: 6px;
  }
  .recent-row .lot { color: #444; font-weight: 500; }
  .recent-row .buyer { color: #1a1a1a; }
  .recent-row .time { color: #888; }
  .recent-row.pending { border-color: #e8c789; background: #fffaf0; }
  .recent-row.pending .time { color: #a35b00; }
</style>
</head>
<body>

<img id="logo" src="logo.png" alt="Fairyhouse 2026 logo">
<h1>Fairyhouse 2026</h1>
<p class="sub" id="statusLine">Loading…</p>
<div id="pendingBanner"></div>

<label for="buyerInput">Buyer name</label>
<input type="text" id="buyerInput" list="buyerList" placeholder="Start typing a name" autocomplete="off">
<datalist id="buyerList"></datalist>

<label>Lots viewed (tap all that apply)</label>
<div id="lotsBox"></div>

<button id="saveBtn" type="button">Submit</button>
<div id="status"></div>

<h2>Recent lots</h2>
<div id="recentList"></div>

<script>
// ==== SET THIS to your deployed Apps Script web app URL ====
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzw_rEfUS7tm2Y-trL73dB-gSB6tcHXJnx6XHom7K_6gzLa8CI6w2P73SSQu6iKbfpWgg/exec";
// =============================================================

// Each lot has a stable "key" (used as the column header AND the sheet tab
// name in Google Sheets — must match exactly) and a "label" (what's shown
// on the button in the app).
const LOTS = [
  { key: "Lot 100 - Ski Club",     label: "Lot 100  BF  Kodi Bear x Ski Club" },
  { key: "Lot 151 - Tiggy Two",    label: "Lot 151  BC  Ardad x Tiggy Two" },
  { key: "Lot 204 - Abashova",     label: "Lot 204  BC  Kodi Bear x Abashova" },
  { key: "Lot 283 - Camomile Lawn",label: "Lot 283  BF  Galiway x Camomile Lawn" },
  { key: "Lot 680 - Faseeha",      label: "Lot 680  BF  Nando Parrado x Faseeha" },
];

const buyerInput = document.getElementById("buyerInput");
const buyerList = document.getElementById("buyerList");
const lotsBox = document.getElementById("lotsBox");
const saveBtn = document.getElementById("saveBtn");
const statusEl = document.getElementById("status");
const statusLine = document.getElementById("statusLine");
const pendingBanner = document.getElementById("pendingBanner");
const recentList = document.getElementById("recentList");

// queue = entries saved locally but not yet confirmed synced to the Sheet
let queue = JSON.parse(localStorage.getItem("cardQueue") || "[]");
// recent = confirmed entries fetched from the Sheet, most recent first
let recent = [];
// local buyer cache, so autocomplete works offline
let allBuyers = JSON.parse(localStorage.getItem("buyerCache") || "[]");

let syncing = false;

function renderLots() {
  lotsBox.innerHTML = "";
  LOTS.forEach(lot => {
    const chip = document.createElement("div");
    chip.className = "lot-chip";
    chip.textContent = lot.label;
    chip.dataset.key = lot.key;
    chip.onclick = () => chip.classList.toggle("checked");
    lotsBox.appendChild(chip);
  });
}

function setStatus(msg, cls) {
  statusEl.textContent = msg;
  statusEl.className = cls || "";
}

function saveQueue() {
  localStorage.setItem("cardQueue", JSON.stringify(queue));
}

function updatePendingBanner() {
  if (queue.length > 0) {
    pendingBanner.textContent = navigator.onLine
      ? `Syncing ${queue.length} unsynced entr${queue.length === 1 ? "y" : "ies"}…`
      : `${queue.length} unsynced entr${queue.length === 1 ? "y" : "ies"} — waiting for internet.`;
    pendingBanner.classList.add("has-pending");
  } else {
    pendingBanner.textContent = "0 unsynced entries";
    pendingBanner.classList.remove("has-pending");
  }
}

function refreshBuyerList() {
  buyerList.innerHTML = allBuyers.map(b => `<option value="${b}">`).join("");
}

// Pull latest buyers + recent activity from the Sheet (only works online)
async function fetchFromServer() {
  if (SCRIPT_URL.includes("PASTE_YOUR")) return false;
  try {
    const res = await fetch(SCRIPT_URL + "?action=data");
    const data = await res.json();
    allBuyers = data.buyers || [];
    recent = data.recent || [];
    localStorage.setItem("buyerCache", JSON.stringify(allBuyers));
    refreshBuyerList();
    return true;
  } catch (err) {
    return false;
  }
}

// Push every queued entry to the Sheet. Stops at the first failure so
// nothing is lost if the connection drops mid-sync.
async function syncQueue() {
  if (syncing || queue.length === 0) return;
  if (SCRIPT_URL.includes("PASTE_YOUR")) return;
  if (!navigator.onLine) { updatePendingBanner(); return; }

  syncing = true;
  updatePendingBanner();

  while (queue.length > 0) {
    const entry = queue[0];
    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ buyer: entry.buyer, lots: entry.lots }),
      });
      queue.shift();
      saveQueue();
    } catch (err) {
      break;
    }
  }

  syncing = false;
  updatePendingBanner();
  await fetchFromServer();
  renderRecent();
  if (queue.length === 0) {
    setStatus("All entries synced.", "ok");
  }
}

function lotLabelFor(key) {
  const found = LOTS.find(l => l.key === key);
  return found ? found.key : key;
}

function renderRecent() {
  const pendingRows = queue.flatMap(entry =>
    entry.lots.map(lotKey => ({
      buyer: entry.buyer,
      lot: lotLabelFor(lotKey),
      time: new Date(entry.timestamp).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
      pending: true,
    }))
  );

  const confirmedRows = recent.map(r => ({
    buyer: r.buyer,
    lot: lotLabelFor(r.lot),
    time: r.time,
    pending: false,
  }));

  const rows = pendingRows.concat(confirmedRows).slice(0, 15);

  if (rows.length === 0) {
    recentList.innerHTML = '<p style="font-size:13px;color:#888;">No entries recorded yet.</p>';
    return;
  }

  recentList.innerHTML = rows.map(r => `
    <div class="recent-row ${r.pending ? "pending" : ""}">
      <span class="lot">${r.lot}</span>
      <span class="buyer">${r.buyer}${r.pending ? " (syncing…)" : ""}</span>
      <span class="time">${r.time}</span>
    </div>
  `).join("");
}

saveBtn.onclick = () => {
  const buyer = buyerInput.value.trim();
  const checkedLots = Array.from(lotsBox.querySelectorAll(".lot-chip.checked")).map(c => c.dataset.key);

  if (!buyer) { setStatus("Enter a buyer name first.", "error"); return; }
  if (checkedLots.length === 0) { setStatus("Tick at least one lot.", "error"); return; }

  queue.push({
    buyer,
    lots: checkedLots,
    timestamp: new Date().toISOString(),
  });
  saveQueue();

  if (!allBuyers.some(b => b.toLowerCase() === buyer.toLowerCase())) {
    allBuyers.push(buyer);
    localStorage.setItem("buyerCache", JSON.stringify(allBuyers));
    refreshBuyerList();
  }

  setStatus(`Submitted ${buyer} for ${checkedLots.length} lot(s).`, "ok");
  buyerInput.value = "";
  lotsBox.querySelectorAll(".lot-chip.checked").forEach(c => c.classList.remove("checked"));
  buyerInput.focus();

  renderRecent();
  updatePendingBanner();
  syncQueue();
};

window.addEventListener("online", syncQueue);
window.addEventListener("focus", syncQueue);
setInterval(syncQueue, 30000);

renderLots();
refreshBuyerList();
updatePendingBanner();
renderRecent();
statusLine.textContent = navigator.onLine ? "Connecting…" : "Offline — entries will sync once you're back online.";
fetchFromServer().then(ok => {
  if (ok) {
    statusLine.textContent = "";
    renderRecent();
    syncQueue();
  } else if (navigator.onLine) {
    statusLine.textContent = "Couldn't reach the sheet — working from local data.";
  }
});
</script>
</body>
</html>
